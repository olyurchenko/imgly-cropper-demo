<form class="form" [formGroup]="form" (ngSubmit)="handleSubmit()">
  <input
    type="file"
    class="file-input"
    (change)="handleFileSelected($event)"
    #fileUpload
  />

  <div class="file-upload">
    <button
      mat-mini-fab
      color="primary"
      class="upload-btn"
      (click)="fileUpload.click()"
    >
      <mat-icon>attach_file</mat-icon>
    </button>
  </div>
</form>

@let fileUrl = (selectedFile$ | async);
@if(fileUrl){
  <app-editor [url]="fileUrl"></app-editor>
}
